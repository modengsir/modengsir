<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Follow {{DISPLAY_NAME}} on X</title>
  <desc id="description">A compact purple and blue contact card for @{{X_HANDLE}}</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F7FF"/>
      <stop offset="0.55" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{PRIMARY_COLOR}}"/>
      <stop offset="1" stop-color="{{SECONDARY_COLOR}}"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8B93A7" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="1194" height="394" rx="36" fill="url(#bg)" stroke="#B9C3D6" stroke-width="6"/>
  <rect x="3" y="3" width="1194" height="394" rx="36" fill="url(#grid)"/>
  <circle cx="1020" cy="195" r="135" fill="url(#accent)" opacity="0.12" filter="url(#glow)"/>
  <rect x="54" y="52" width="12" height="72" rx="6" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="103" font-size="28" font-weight="700" letter-spacing="8" fill="#5D6472">{{CARD_LABEL}}</text>
    <text x="92" y="225" font-size="72" font-weight="800" fill="#16181D">@{{X_HANDLE}}</text>
    <text x="94" y="316" font-size="24" font-weight="650" letter-spacing="6" fill="#6C7280">X.COM / {{X_HANDLE}}</text>
  </g>

  <g transform="translate(970 105)" fill="none" stroke="url(#accent)" stroke-width="29" stroke-linecap="round">
    <path d="M24 20L168 188"/>
    <path d="M166 20L22 188"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="5" opacity="0.7">
    <path d="M1120 42h34v34"/>
    <path d="M80 358H46v-34"/>
  </g>
</svg>
